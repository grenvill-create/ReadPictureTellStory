<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDF2FD"/>
      <stop offset="65%" stop-color="#FFF7EE"/>
      <stop offset="100%" stop-color="#FFEFE6"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBEFD9"/>
      <stop offset="100%" stop-color="#AEE2C4"/>
    </linearGradient>
    <linearGradient id="grassBank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9EAC8"/>
      <stop offset="100%" stop-color="#8FD4A8"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CD7F7"/>
      <stop offset="100%" stop-color="#6BBCEB"/>
    </linearGradient>
    <linearGradient id="logGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A47F"/>
      <stop offset="50%" stop-color="#C48960"/>
      <stop offset="100%" stop-color="#9E6642"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5B4B49" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Soft Sun -->
  <circle cx="150" cy="115" r="58" fill="#FFE699" opacity="0.85"/>
  <circle cx="150" cy="115" r="44" fill="#FFD966"/>

  <!-- Fluffy Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="420" cy="105" rx="68" ry="30"/>
    <ellipse cx="465" cy="95" rx="45" ry="26"/>
    <ellipse cx="380" cy="112" rx="40" ry="22"/>

    <ellipse cx="960" cy="120" rx="75" ry="32"/>
    <ellipse cx="1010" cy="108" rx="50" ry="28"/>
    <ellipse cx="915" cy="126" rx="42" ry="22"/>
  </g>

  <!-- Distant Hills -->
  <path d="M0,410 Q280,310 580,390 T1280,360 L1280,720 L0,720 Z" fill="url(#hillBack)"/>
  <path d="M0,450 Q360,370 700,435 T1280,415 L1280,720 L0,720 Z" fill="#BCE8CE"/>

  <!-- Stream in Center -->
  <path d="M510,415 C530,480 460,560 400,720 L880,720 C810,560 750,480 730,415 Z" fill="url(#streamGrad)"/>
  <!-- Water Ripples -->
  <g stroke="#E3F5FF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M570,565 Q610,555 650,565"/>
    <path d="M530,625 Q585,612 635,625"/>
    <path d="M620,665 Q675,652 730,665"/>
    <path d="M545,455 Q590,445 630,455"/>
  </g>

  <!-- Left & Right Grassy Banks -->
  <path d="M0,435 Q280,400 520,445 Q470,580 410,720 L0,720 Z" fill="url(#grassBank)"/>
  <path d="M1280,435 Q1000,400 725,445 Q775,580 865,720 L1280,720 Z" fill="url(#grassBank)"/>

  <!-- Bushes -->
  <g fill="#95D6AE">
    <circle cx="80" cy="435" r="55"/>
    <circle cx="135" cy="445" r="42"/>
    <circle cx="1190" cy="430" r="60"/>
    <circle cx="1130" cy="445" r="44"/>
  </g>

  <!-- Pastel Wildflowers -->
  <g>
    <circle cx="160" cy="560" r="10" fill="#FFB7C5"/><circle cx="160" cy="560" r="4" fill="#FFE066"/>
    <circle cx="240" cy="610" r="11" fill="#FFF099"/><circle cx="240" cy="610" r="4" fill="#FFA94D"/>
    <circle cx="1050" cy="575" r="10" fill="#FFB7C5"/><circle cx="1050" cy="575" r="4" fill="#FFE066"/>
    <circle cx="1130" cy="625" r="11" fill="#C9B6FF"/><circle cx="1130" cy="625" r="4" fill="#FFE066"/>
  </g>

  <!-- Narrow Wooden Log Bridge (Hotspot 3: x=50%, y=69% -> 640, 497) -->
  <g filter="url(#softShadow)">
    <!-- Bridge Supports -->
    <rect x="440" y="490" width="24" height="75" rx="8" fill="#8C583A"/>
    <rect x="816" y="490" width="24" height="75" rx="8" fill="#8C583A"/>
    <!-- Main Log -->
    <rect x="290" y="445" width="700" height="64" rx="28" fill="url(#logGrad)" stroke="#8B5A3C" stroke-width="4"/>
    <!-- Wood Grain -->
    <path d="M350,468 Q430,460 510,470" stroke="#A66E4E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M580,482 Q660,490 740,480" stroke="#A66E4E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M790,466 Q870,460 930,472" stroke="#A66E4E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Log Ends -->
    <ellipse cx="305" cy="477" rx="14" ry="28" fill="#E8C39E" stroke="#8B5A3C" stroke-width="3"/>
    <ellipse cx="975" cy="477" rx="14" ry="28" fill="#E8C39E" stroke="#8B5A3C" stroke-width="3"/>
  </g>

  <!-- Left White Goat (Hotspot 1: x=32%, y=44% -> 410, 317) -->
  <g transform="translate(410, 330)" filter="url(#softShadow)">
    <!-- Tail -->
    <ellipse cx="-82" cy="18" rx="14" ry="10" fill="#FFFFFF" stroke="#D9D2CC" stroke-width="3"/>
    <!-- Back Legs -->
    <rect x="-55" y="55" width="18" height="62" rx="8" fill="#F2ECE6" stroke="#D9D2CC" stroke-width="3"/>
    <rect x="-55" y="102" width="18" height="16" rx="5" fill="#7D6B66"/>
    <!-- Front Legs -->
    <rect x="28" y="55" width="18" height="62" rx="8" fill="#FFFFFF" stroke="#D9D2CC" stroke-width="3"/>
    <rect x="28" y="102" width="18" height="16" rx="5" fill="#7D6B66"/>
    <!-- Fluffy Body -->
    <ellipse cx="-10" cy="25" rx="72" ry="48" fill="#FFFFFF" stroke="#D9D2CC" stroke-width="3"/>
    <circle cx="-48" cy="10" r="24" fill="#FFFFFF"/>
    <circle cx="-15" cy="-10" r="26" fill="#FFFFFF"/>
    <circle cx="22" cy="0" r="24" fill="#FFFFFF"/>
    <!-- Neck & Head -->
    <ellipse cx="58" cy="-35" rx="42" ry="36" fill="#FFFFFF" stroke="#D9D2CC" stroke-width="3"/>
    <!-- Cute Ear -->
    <ellipse cx="30" cy="-58" rx="18" ry="9" transform="rotate(-25 30 -58)" fill="#FFE0E6" stroke="#D9D2CC" stroke-width="2"/>
    <!-- Horns -->
    <path d="M42,-66 Q32,-102 12,-96" fill="none" stroke="#E5C07B" stroke-width="10" stroke-linecap="round"/>
    <path d="M62,-68 Q56,-104 38,-98" fill="none" stroke="#E5C07B" stroke-width="10" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="72" cy="-40" r="6" fill="#3D312E"/>
    <circle cx="74" cy="-42" r="2" fill="#FFFFFF"/>
    <!-- Stubborn Brow -->
    <path d="M60,-52 L84,-45" stroke="#5B4B49" stroke-width="4" stroke-linecap="round"/>
    <!-- Rosy Cheek & Nose -->
    <ellipse cx="64" cy="-24" rx="9" ry="5" fill="#FFB3C1" opacity="0.7"/>
    <circle cx="96" cy="-30" r="5" fill="#FF9EB5"/>
    <!-- Beard -->
    <path d="M78,-4 Q84,16 70,22 Q64,8 68,-2 Z" fill="#F5EFEA" stroke="#D9D2CC" stroke-width="2"/>
  </g>

  <!-- Right Brown Goat (Hotspot 2: x=68%, y=44% -> 870, 317) -->
  <g transform="translate(870, 330) scale(-1, 1)" filter="url(#softShadow)">
    <!-- Tail -->
    <ellipse cx="-82" cy="18" rx="14" ry="10" fill="#D4A373" stroke="#A97C50" stroke-width="3"/>
    <!-- Back Legs -->
    <rect x="-55" y="55" width="18" height="62" rx="8" fill="#C49160" stroke="#A97C50" stroke-width="3"/>
    <rect x="-55" y="102" width="18" height="16" rx="5" fill="#5C4438"/>
    <!-- Front Legs -->
    <rect x="28" y="55" width="18" height="62" rx="8" fill="#D4A373" stroke="#A97C50" stroke-width="3"/>
    <rect x="28" y="102" width="18" height="16" rx="5" fill="#5C4438"/>
    <!-- Body -->
    <ellipse cx="-10" cy="25" rx="72" ry="48" fill="#D4A373" stroke="#A97C50" stroke-width="3"/>
    <!-- Neck & Head -->
    <ellipse cx="58" cy="-35" rx="42" ry="36" fill="#DDB082" stroke="#A97C50" stroke-width="3"/>
    <!-- Cute Ear -->
    <ellipse cx="30" cy="-58" rx="18" ry="9" transform="rotate(-25 30 -58)" fill="#F3C6B6" stroke="#A97C50" stroke-width="2"/>
    <!-- Horns -->
    <path d="M42,-66 Q32,-102 12,-96" fill="none" stroke="#8C6239" stroke-width="10" stroke-linecap="round"/>
    <path d="M62,-68 Q56,-104 38,-98" fill="none" stroke="#8C6239" stroke-width="10" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="72" cy="-40" r="6" fill="#3D312E"/>
    <circle cx="74" cy="-42" r="2" fill="#FFFFFF"/>
    <!-- Stubborn Brow -->
    <path d="M60,-52 L84,-45" stroke="#4A3728" stroke-width="4" stroke-linecap="round"/>
    <!-- Rosy Cheek & Nose -->
    <ellipse cx="64" cy="-24" rx="9" ry="5" fill="#FF9AA2" opacity="0.65"/>
    <circle cx="96" cy="-30" r="5" fill="#5C4438"/>
    <!-- Beard -->
    <path d="M78,-4 Q84,16 70,22 Q64,8 68,-2 Z" fill="#C49160" stroke="#A97C50" stroke-width="2"/>
  </g>
</svg>
