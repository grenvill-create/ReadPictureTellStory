<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyTJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDF2FD"/>
      <stop offset="65%" stop-color="#FFF7EE"/>
      <stop offset="100%" stop-color="#FFEAD7"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6DFB8"/>
      <stop offset="100%" stop-color="#E7C28D"/>
    </linearGradient>
    <filter id="shadowTJ" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5B4B49" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky & Clouds -->
  <rect width="1280" height="720" fill="url(#skyTJ)"/>
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="280" cy="110" rx="78" ry="30"/>
    <ellipse cx="330" cy="98" rx="48" ry="26"/>
    <ellipse cx="640" cy="85" rx="64" ry="26"/>
    <ellipse cx="685" cy="76" rx="42" ry="20"/>
  </g>

  <!-- Distant Pastel Hills -->
  <path d="M0,370 Q260,285 560,360 T1280,335 L1280,720 L0,720 Z" fill="#CBEFD9"/>
  <path d="M0,415 Q380,350 760,405 T1280,390 L1280,720 L0,720 Z" fill="#B2E3C6"/>

  <!-- Racecourse Sand Track -->
  <path d="M0,455 Q640,420 1280,465 L1280,720 L0,720 Z" fill="url(#trackGrad)"/>
  <!-- Track Lane Lines -->
  <path d="M0,565 Q640,535 1280,575" stroke="#FFF4E0" stroke-width="4" stroke-dasharray="16,14" fill="none" opacity="0.8"/>
  <!-- Wooden Fence -->
  <g stroke="#C9966B" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="450" x2="880" y2="438"/>
    <line x1="60" y1="425" x2="60" y2="475"/>
    <line x1="220" y1="422" x2="220" y2="472"/>
    <line x1="380" y1="420" x2="380" y2="470"/>
    <line x1="540" y1="418" x2="540" y2="468"/>
    <line x1="700" y1="416" x2="700" y2="466"/>
    <line x1="860" y1="414" x2="860" y2="464"/>
  </g>

  <!-- Royal Viewing Pavilion on Right (behind King of Qi) -->
  <g transform="translate(1050, 302)" filter="url(#shadowTJ)">
    <!-- Pavilion Pillars -->
    <rect x="-125" y="-65" width="16" height="195" fill="#D97B7B"/>
    <rect x="109" y="-65" width="16" height="195" fill="#D97B7B"/>
    <!-- Pavilion Platform -->
    <rect x="-145" y="105" width="290" height="32" rx="6" fill="#E8C39E" stroke="#B5835A" stroke-width="3"/>
    <!-- Curved Roof -->
    <path d="M-165,-60 Q0,-135 165,-60 L140,-42 Q0,-85 -140,-42 Z" fill="#FF9E9E" stroke="#C96464" stroke-width="3"/>
    <!-- Banners -->
    <rect x="-152" y="-42" width="20" height="65" rx="4" fill="#FFD166"/>
    <rect x="132" y="-42" width="20" height="65" rx="4" fill="#8CD2FF"/>

    <!-- Hotspot 3: King of Qi (x=82%, y=42% -> 1050, 302) -->
    <g transform="translate(0, 15)">
      <!-- Royal Robe -->
      <path d="M-42,88 L-28,-5 Q0,-15 28,-5 L42,88 Z" fill="#FFD97D" stroke="#D49A3A" stroke-width="3"/>
      <path d="M-10,-5 L0,45 L10,-5" fill="#FF8FA3"/>
      <!-- Head -->
      <circle cx="0" cy="-35" r="30" fill="#FFE0C8" stroke="#D9A78C" stroke-width="2.5"/>
      <!-- Royal Crown -->
      <rect x="-24" y="-76" width="48" height="14" rx="4" fill="#5B4B49"/>
      <rect x="-34" y="-82" width="68" height="8" rx="3" fill="#FFD166" stroke="#D49A3A" stroke-width="2"/>
      <!-- Surprised Eyes & Beard -->
      <circle cx="-10" cy="-38" r="4" fill="#3D312E"/>
      <circle cx="10" cy="-38" r="4" fill="#3D312E"/>
      <circle cx="0" cy="-22" r="4" fill="#FF8FA3"/>
      <path d="M-12,-14 Q0,-4 12,-14" fill="none" stroke="#5B4B49" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hotspot 1: Strategist Sun Bin on Left (x=24%, y=55% -> 307, 396) -->
  <g transform="translate(307, 420)" filter="url(#shadowTJ)">
    <!-- Sky-blue Scholar Robe -->
    <path d="M-48,145 L-30,0 Q0,-12 30,0 L48,145 Z" fill="#9BD7F5" stroke="#5CA4C9" stroke-width="3"/>
    <path d="M-24,5 L0,60 L24,5" fill="#FFFFFF" opacity="0.7"/>
    <!-- Waist Sash -->
    <rect x="-34" y="55" width="68" height="12" rx="5" fill="#FFD166"/>
    <!-- Head -->
    <circle cx="0" cy="-36" r="32" fill="#FFE0C8" stroke="#D9A78C" stroke-width="2.5"/>
    <!-- Topknot Hair & Ribbon -->
    <circle cx="0" cy="-70" r="14" fill="#4A3E3B"/>
    <rect x="-12" y="-66" width="24" height="7" rx="3" fill="#9BD7F5"/>
    <!-- Wise Smiling Face -->
    <path d="M-16,-40 Q-10,-46 -4,-40" fill="none" stroke="#3D312E" stroke-width="3" stroke-linecap="round"/>
    <path d="M4,-40 Q10,-46 16,-40" fill="none" stroke="#3D312E" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8,-22 Q0,-14 8,-22" fill="none" stroke="#D97B7B" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-18" cy="-28" rx="6" ry="3.5" fill="#FFB3C1" opacity="0.7"/>
    <ellipse cx="18" cy="-28" rx="6" ry="3.5" fill="#FFB3C1" opacity="0.7"/>
    <!-- Feather Fan in Hand -->
    <g transform="translate(46, 20) rotate(20)">
      <line x1="0" y1="35" x2="0" y2="-10" stroke="#A67C52" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-24" rx="22" ry="28" fill="#FFFFFF" stroke="#D9E8F5" stroke-width="2.5"/>
      <path d="M0,-2 L0,-46 M-12,-10 L-18,-36 M12,-10 L18,-36" stroke="#CBE3F5" stroke-width="2"/>
    </g>
  </g>

  <!-- Hotspot 2: Tian Ji's Galloping Racehorse in Center (x=56%, y=62% -> 717, 446) -->
  <g transform="translate(717, 485)" filter="url(#shadowTJ)">
    <!-- Dust Puffs -->
    <g fill="#FFF5E4" opacity="0.85">
      <circle cx="-115" cy="75" r="18"/>
      <circle cx="-90" cy="82" r="14"/>
      <circle cx="-138" cy="82" r="12"/>
    </g>
    <!-- Flowing Tail -->
    <path d="M-78,-10 Q-130,-25 -135,15 Q-110,10 -80,8 Z" fill="#7D4E38"/>
    <!-- Galloping Legs -->
    <path d="M-55,35 L-88,78" stroke="#D48C64" stroke-width="15" stroke-linecap="round"/>
    <path d="M-30,38 L-48,88" stroke="#C07650" stroke-width="15" stroke-linecap="round"/>
    <path d="M45,35 L85,72" stroke="#D48C64" stroke-width="15" stroke-linecap="round"/>
    <path d="M65,30 L105,55" stroke="#C07650" stroke-width="15" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="0" cy="8" rx="82" ry="44" fill="#E39D74" stroke="#B56E48" stroke-width="3"/>
    <!-- Saddle Cloth -->
    <path d="M-28,-34 L28,-34 L34,12 Q0,20 -34,12 Z" fill="#FF8FA3" stroke="#E06C84" stroke-width="2.5"/>
    <!-- Neck & Head -->
    <path d="M48,-12 L86,-68 L112,-50 L74,16 Z" fill="#E39D74" stroke="#B56E48" stroke-width="3"/>
    <!-- Flowing Mane -->
    <path d="M48,-18 Q56,-56 80,-74 L74,-44 Z" fill="#7D4E38"/>
    <!-- Head -->
    <ellipse cx="106" cy="-54" rx="34" ry="20" transform="rotate(24 106 -54)" fill="#E39D74" stroke="#B56E48" stroke-width="3"/>
    <polygon points="82,-74 90,-94 98,-72" fill="#E39D74" stroke="#B56E48" stroke-width="2.5"/>
    <!-- Eye & Cheerful Look -->
    <circle cx="106" cy="-60" r="4.5" fill="#3D312E"/>
    <circle cx="107.5" cy="-61.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="132" cy="-42" r="4" fill="#7D4E38"/>
  </g>
</svg>
